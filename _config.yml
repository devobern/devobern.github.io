title: "Nicolin Dora"
description: "Security Analyst • Student • Maker"
url: "https://nicolin-dora.ch"
baseurl: ""
locale: "de-CH"
show_banner: false

# --- Mehrsprachigkeit ---------------------------------------------------
# Deutsch liegt auf den bestehenden Root-URLs, Englisch unter /en/.
# UI-Strings: _data/i18n.yml, Navigation: _data/navigation.yml.
# Seiten/Posts werden über das gemeinsame Feld `ref` als Übersetzungen
# desselben Inhalts verknüpft.
default_lang: "de"
languages: ["de", "en"]

# Autorprofil
author:
  name: "Nicolin Dora"
  email: "mail@nicolin-dora.ch"
  avatar: "/assets/images/avatar_c.jpg"
  bio: "Kurzprofil folgt."
  location: "Bern/Biel, Schweiz"
  links:
    - label: "E-Mail"
      icon: "fas fa-envelope"
      url: "mailto:mail@nicolin-dora.ch"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/devobern"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/in/nicolindora"

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  posts:
    output: true
    permalink: /blog/:title/
  pages:
    output: true
    # Optional: collection-wide permalink if a page has none set
    # permalink: /:title/

# Standard-Layouts
defaults:
  # All standalone pages under _pages use the simple page layout
  - scope:
      path: "_pages"
    values:
      layout: page
      lang: "de"
  # Posts use the page layout, which shows title and date
  - scope:
      type: posts
    values:
      layout: page
      lang: "de"

social:
  type: "Person"
  name: "Nicolin Dora"

markdown: kramdown
permalink: pretty
include:
  - .well-known

# Nicht veröffentlichen (Jekyll-Defaults plus projektspezifische Pfade)
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - photos/
  - vendor/
  - .bundle/
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/