{%- include i18n.html -%}
<section class="comments" aria-labelledby="comments-title">
  <h2 id="comments-title">{{ t.comments_title }}</h2>

  <p class="comments-intro">
    {{ t.comments_intro_before }} <a href="https://giscus.app" target="_blank" rel="noopener noreferrer">Giscus</a>{{ t.comments_intro_after }}
  </p>

  <script src="https://giscus.app/client.js"
  data-repo="devobern/devobern.github.io"
  data-repo-id="R_kgDOP62GQA"
  data-category="Announcements"
  data-category-id="DIC_kwDOP62GQM4Cx2Xw"
  data-mapping="specific"
  data-term="{{ page.giscus_term | default: page.ref | default: page.url }}"
  data-strict="0"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="bottom"
  data-theme="light"
  data-lang="{{ t.giscus_lang }}"
  data-loading="lazy"
  crossorigin="anonymous"
  async>
  </script>

  <p class="comments-fallback">
    {{ t.comments_fallback_before }}
    <a href="mailto:{{ site.author.email | default: 'mail@nicolin-dora.ch' }}?subject={{ t.comments_subject | append: ' ' | append: page.title | uri_escape }}">{{ t.comments_fallback_link }}</a>{{ t.comments_fallback_after }}
  </p>
</section>
